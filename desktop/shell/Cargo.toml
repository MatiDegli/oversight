[package]
name = "oversight-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
oversight-desktop-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.0", default-features = false, features = ["wry", "common-controls-v6"] }
tauri-plugin-single-instance = { version = "=2.5.5", default-features = false }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.0", default-features = false, features = ["config-json"] }
