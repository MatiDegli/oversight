name: Set up gitleaks
description: Install the pinned scanner for history scans and recording publication tests
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 8.30.1
      run: |
        set -euo pipefail
        scratch=$(mktemp -d)
        trap 'rm -rf "$scratch"' EXIT
        cd "$scratch"
        curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
        echo "$(grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | cut -d' ' -f1)  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        mkdir -p "$RUNNER_TEMP/oversight-tools"
        install -m 755 gitleaks "$RUNNER_TEMP/oversight-tools/gitleaks"
        echo "$RUNNER_TEMP/oversight-tools" >> "$GITHUB_PATH"
