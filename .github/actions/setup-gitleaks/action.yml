name: Set up gitleaks
description: Install the pinned scanner for history scans and recording publication tests
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo 'version=8.30.1' >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        scratch=$(mktemp -d)
        trap 'rm -rf "$scratch"' EXIT
        cd "$scratch"
        curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
        echo "$(grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | cut -d' ' -f1)  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        mkdir -p "$RUNNER_TEMP/oversight-tools"
        install -m 755 gitleaks "$RUNNER_TEMP/oversight-tools/gitleaks"
        echo "$RUNNER_TEMP/oversight-tools" >> "$GITHUB_PATH"
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
        New-Item -ItemType Directory $scratch | Out-Null
        try {
          $asset = "gitleaks_${env:VERSION}_windows_x64.zip"
          $release = "https://github.com/gitleaks/gitleaks/releases/download/v${env:VERSION}"
          $zip = Join-Path $scratch $asset
          Invoke-WebRequest "$release/$asset" -OutFile $zip
          Invoke-WebRequest "$release/gitleaks_${env:VERSION}_checksums.txt" -OutFile "$scratch/checksums.txt"
          $lines = @(Get-Content "$scratch/checksums.txt" | Where-Object { ($_ -split '\s+')[-1] -ceq $asset })
          if ($lines.Count -ne 1) { throw 'Expected exactly one gitleaks checksum line' }
          $expected = ($lines[0] -split '\s+')[0]
          if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) {
            throw 'Gitleaks checksum mismatch'
          }
          $tools = Join-Path $env:RUNNER_TEMP 'oversight-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entry = $archive.GetEntry('gitleaks.exe')
            if ($null -eq $entry) { throw 'Gitleaks executable missing from archive' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $tools 'gitleaks.exe'), $true)
          } finally { $archive.Dispose() }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } finally { Remove-Item -Recurse -Force $scratch }
