name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Vite plugin validates the real recording against Python's source contracts.
      - run: make install
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the recorded replay and deep-link fallback
        run: |
          pnpm -C frontend exec vite build --mode replay --base /oversight/ --outDir dist/pages --emptyOutDir --configLoader runner
          cp frontend/dist/pages/index.html frontend/dist/pages/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke test the published HTML and a hashed asset
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(--fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 120 --connect-timeout 10 --max-time 30)
          curl "${curl_args[@]}" "$PAGE_URL" -o /tmp/pages.html
          asset_url=$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path('/tmp/pages.html').read_text()
          assets = re.findall(r'''(?:src|href)=["'](/oversight/assets/[^"'/?]+-[\w-]{8,}\.(?:js|css))["']''', html)
          if not assets:
              raise SystemExit('No hashed /oversight/assets/ reference in the published HTML')
          print(urljoin(os.environ['PAGE_URL'], assets[0]))
          PY
          )
          curl "${curl_args[@]}" "$asset_url" -o /tmp/pages-asset
          test -s /tmp/pages-asset
