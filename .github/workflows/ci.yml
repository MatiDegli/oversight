name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan the whole history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make install
      - uses: ./.github/actions/setup-gitleaks
      - run: make check-ci
      - run: make smoke
      - name: Report network isolation probe
        run: |
          uv run --frozen python -m oversight isolation-probe > /tmp/isolation-probe.json
          uv run --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path

          verdict = json.loads(Path("/tmp/isolation-probe.json").read_text())
          status = verdict["status"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Network isolation probe: **{status}**\n\n")
              summary.write("```json\n" + json.dumps(verdict, indent=2) + "\n```\n")
          if status not in {"confirmed", "unavailable"}:
              raise SystemExit(1)
          PY

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    # Green CI: test-browser took 8m46s; 25 minutes covers setup and a slow runner with margin.
    # Exceeding the cap on a fast runner is a test defect, not a reason to raise it.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make install
      - uses: ./.github/actions/setup-gitleaks
      # The Chromium build is the one the pinned @playwright/test (frontend/package.json) names.
      - name: Install Playwright's Chromium and its system libraries
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Monaco and graph tests in Chromium
        run: make test-browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Green CI: e2e took 3m58s; 15 minutes covers setup and a slow runner with margin.
    # Exceeding the cap on a fast runner is a test defect, not a reason to raise it.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make install
      - uses: ./.github/actions/setup-gitleaks
      # The Chromium build is the one the pinned @playwright/test (frontend/package.json) names.
      - name: Install Playwright's Chromium and its system libraries
        run: pnpm -C frontend exec playwright install --with-deps chromium
      - name: Playwright over the static replay build
        run: make e2e
      - name: Upload e2e failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
