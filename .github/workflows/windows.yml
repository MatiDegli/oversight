name: windows advisory

on:
  pull_request:
    paths: [desktop/**, backend/**, contracts/**, tools/**, frontend/**, demo-repo/**, fixtures/**, docs/**, README.md, ARCHITECTURE.md, DECISIONS.md, .github/**, .gitattributes, .python-version, pyproject.toml, uv.lock, conftest.py, Makefile]
  push:
    branches: [main, 'desktop/**']
    paths: [desktop/**, backend/**, contracts/**, tools/**, frontend/**, demo-repo/**, fixtures/**, docs/**, README.md, ARCHITECTURE.md, DECISIONS.md, .github/**, .gitattributes, .python-version, pyproject.toml, uv.lock, conftest.py, Makefile]
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    name: windows advisory
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      META_API_KEY: ""
      BASETEN_API_KEY: ""
      OVERSIGHT_CROSS_REVIEW: "false"
      OVERSIGHT_WORKSPACE_SOURCE: ""
      OVERSIGHT_AGENT_MODEL: fake
      OVERSIGHT_AGENT_MODEL_B: fake
      OVERSIGHT_FAKE_SCRIPT: fixtures/fake-model/demo-l2-coupon.json
      OVERSIGHT_FAKE_SCRIPT_B: fixtures/fake-model/demo-l2-restock.json
      OVERSIGHT_NT_EVIDENCE_DIR: ${{ github.workspace }}/nt-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Versions and staging
        run: |
          New-Item -ItemType Directory -Force nt-evidence | Out-Null
          uv --version | Tee-Object nt-evidence/versions.log
          git --version | Tee-Object -Append nt-evidence/versions.log
          node --version | Tee-Object -Append nt-evidence/versions.log
          pnpm --version | Tee-Object -Append nt-evidence/versions.log
          [System.Environment]::OSVersion.VersionString | Tee-Object -Append nt-evidence/versions.log
          'Private own-copy composition is covered by injections. Public own paths remain closed. Integrated six-run/two-machine qualification remains pending; skips are not acceptance.' | Set-Content nt-evidence/staging.txt
      - run: uv sync --frozen
      - run: pnpm -C frontend install --frozen-lockfile
      - uses: ./.github/actions/setup-gitleaks
      - name: Gitleaks version
        run: gitleaks version | Tee-Object -Append nt-evidence/versions.log
      - id: frontend_build
        run: pnpm -C frontend build
      - name: Windows target typing for landed sites
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: uv run --frozen pyright --pythonplatform Windows tools/demo_check_nt.py tools/demo_check.py tools/smoke.py tools/tests/test_demo_check_nt.py tools/tests/test_demo_check.py tools/tests/test_smoke.py tools/tests/test_pages_workflow.py tools/tests/test_verify_workflow.py backend/src/oversight/__main__.py backend/src/oversight/api/static.py backend/src/oversight/app.py backend/src/oversight/events/store.py backend/src/oversight/workspace/__init__.py backend/src/oversight/workspace/_platform.py backend/src/oversight/workspace/capability.py backend/src/oversight/workspace/core.py backend/src/oversight/workspace/files.py backend/src/oversight/workspace/integrity.py backend/src/oversight/workspace/isolation.py backend/src/oversight/workspace/metadata_io.py backend/src/oversight/workspace/runner.py backend/src/oversight/workspace/source.py backend/src/oversight/workspace/test_tree.py backend/src/oversight/workspace/tree.py backend/src/oversight/workspace/snapshot.py backend/src/oversight/workspace/suite_files.py backend/src/oversight/workspace/suite_guard.py backend/src/oversight/agents/tools.py backend/tests/workspace/test_source_bytes.py backend/tests/workspace/test_source_bytes_windows.py backend/tests/agents/test_tools_nt_bytes.py backend/tests/api/test_files.py
      - name: W1 native cases
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          uv run --frozen pytest -o timeout_method=thread backend/tests/workspace/test_platform_windows.py -rs -s 2>&1 | Tee-Object nt-evidence/w1-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: W3 injected and native cases
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          uv run --frozen pytest -o timeout_method=thread tools/tests/test_demo_check_nt.py -rs -s 2>&1 | Tee-Object nt-evidence/w3-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: W4b injected and native byte cases
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          uv run --frozen pytest -o timeout_method=thread backend/tests/workspace/test_source_bytes.py backend/tests/workspace/test_source_bytes_windows.py backend/tests/agents/test_tools_nt_bytes.py -n 2 -rs -s 2>&1 | Tee-Object nt-evidence/w4b-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: W4a2 injected and native reset cases
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          uv run --frozen pytest -o timeout_method=thread backend/tests/workspace/test_source_nt_copy.py backend/tests/workspace/test_source_nt_reset.py backend/tests/workspace/test_source_nt_reset_windows.py -n 2 -rs -s 2>&1 | Tee-Object nt-evidence/w4a2-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke with retained jobs
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          uv run --frozen python tools/smoke.py 2>&1 | Tee-Object nt-evidence/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Private own-copy composition and native fixtures
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          uv run --frozen pytest -o timeout_method=thread backend/tests/test_source_nt_startup.py backend/tests/test_source_trust_once.py backend/tests/workspace/test_source_nt_lifecycle.py backend/tests/workspace/test_source_nt_windows.py -n 2 -rs -s 2>&1 | Tee-Object nt-evidence/own-copy-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'After public enablement, on both Windows machines: uv run --frozen python tools/demo_check_nt.py --own-fixtures. No six-run acceptance collected here.' | Set-Content nt-evidence/own-driver-pending.txt
      - name: Report unavailable Linux isolation
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          uv run --frozen python -m oversight isolation-probe > nt-evidence/isolation-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Get-Content -Raw nt-evidence/isolation-probe.json | ConvertFrom-Json
          if ($probe.status -ne 'unavailable' -or $probe.reason -ne 'network isolation C is Linux-only') { throw 'Unexpected NT isolation verdict' }
      - name: Desktop Rust toolchain
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Seed desktop Cargo store
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          cargo fetch --locked --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable desktop checks
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        run: |
          $env:CARGO_NET_OFFLINE = 'true'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo --offline --locked fmt --manifest-path desktop/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --offline test --locked --manifest-path desktop/Cargo.toml -p oversight-desktop-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer.Stop()
          "Portable desktop checks: $($timer.Elapsed.TotalSeconds) seconds; executable/size/native shell acceptance deferred." | Set-Content nt-evidence/desktop.txt
      - name: Runtime version evidence
        if: always()
        run: |
          uv run --frozen python -c "import asyncio,platform; loop=asyncio.new_event_loop(); print(platform.python_version(), type(loop).__name__); loop.close()" 2>&1 | Tee-Object nt-evidence/python-loop.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-advisory-evidence
          path: nt-evidence/
          if-no-files-found: error
          retention-days: 7

  package:
    name: desktop installer
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      META_API_KEY: ""
      BASETEN_API_KEY: ""
      OVERSIGHT_CROSS_REVIEW: "false"
      OVERSIGHT_WORKSPACE_SOURCE: ""
      OVERSIGHT_AGENT_MODEL: fake
      OVERSIGHT_AGENT_MODEL_B: fake
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set desktop Cargo home
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP\oversight-tauri-cargo" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.21"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.0"
      - name: Prepare exact Rust toolchain and Cargo store
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare frozen build inputs
        run: |
          uv sync --frozen --python 3.12.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C frontend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm dlx @tauri-apps/cli@2.12.0 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline locked desktop checks and metadata
        run: |
          $env:CARGO_NET_OFFLINE = 'true'
          New-Item -ItemType Directory -Force package-evidence, desktop/packaging/cache | Out-Null
          cargo --offline --locked fmt --manifest-path desktop/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --offline test --locked --manifest-path desktop/Cargo.toml -p oversight-desktop-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --offline metadata --locked --manifest-path desktop/Cargo.toml --filter-platform x86_64-pc-windows-msvc --format-version 1 > desktop/packaging/cache/cargo-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --offline metadata --locked --manifest-path desktop/Cargo.toml --format-version 1 > desktop/packaging/cache/cargo-all-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage verified embedded runtimes and notices
        run: |
          uv run --frozen python desktop/packaging/stage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/packaging/stage/app/payload.json package-evidence/
          Copy-Item desktop/packaging/stage/app/THIRD_PARTY_NOTICES.md package-evidence/
      - name: Build locked NSIS installer
        run: |
          $env:CARGO_NET_OFFLINE = 'true'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          Push-Location desktop/shell
          try {
            pnpm --offline dlx @tauri-apps/cli@2.12.0 build --ci --bundles nsis -- --offline --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $timer.Stop()
          "Installer build seconds: $($timer.Elapsed.TotalSeconds)" | Set-Content package-evidence/build.txt
      - name: Install smoke twice and preserve data on uninstall
        timeout-minutes: 8
        run: ./desktop/packaging/installed-smoke.ps1
      - name: Upload desktop installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oversight-windows-installer
          path: |
            desktop/target/release/bundle/nsis/*-setup.exe
            package-evidence/
          if-no-files-found: error
          retention-days: 7
