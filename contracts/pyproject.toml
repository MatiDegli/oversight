[project]
name = "oversight-contracts"
version = "0.1.0"
description = "Oversight's wire contracts: the Pydantic models every other format is generated from."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.1"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
